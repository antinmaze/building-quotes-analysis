name: Deploy Azure AI pilot
run-name: Azure AI pilot - ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or deploy the approved pilot infrastructure
        required: true
        default: preview
        type: choice
        options:
          - preview
          - deploy

permissions:
  contents: read

concurrency:
  group: azure-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-pilot
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate with Azure OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Preview and optionally deploy Bicep
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPERATOR_OBJECT_ID: ${{ secrets.AZURE_OPERATOR_OBJECT_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          OPERATION: ${{ inputs.operation }}
        run: bash scripts/deploy-azure.sh
